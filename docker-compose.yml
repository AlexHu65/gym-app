services:
  postgres:
    image: postgres:16
    container_name: gym-postgres
    environment:
      POSTGRES_DB: gym_app
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gym-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: gym-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gymadmin
      MINIO_ROOT_PASSWORD: gymadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: gym-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  minio_data:

